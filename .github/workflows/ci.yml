name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # engines requires node >=22 (pnpm 11 itself needs >=22.13)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  dogfood:
    name: dogfood (agentgate scans itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: bundled advisory data in sync with /advisories
        run: |
          node packages/core/scripts/bundle-advisories.mjs
          git diff --exit-code packages/core/src/advisories/data.ts
      - name: advisory counts in docs match /advisories
        run: node scripts/check-advisory-count.mjs
      - name: docs client lists cover all discovery clients
        run: node scripts/check-client-lists.mjs
      - name: root action.yml (Marketplace) in sync with packages/action
        run: node scripts/check-action-sync.mjs
      - name: agentgate scan (repo, static)
        run: >
          node packages/cli/dist/index.js scan .
          --ignore 'packages/core/src/rules/**' 'packages/*/test/**' 'website/**'
          --fail-on critical
      - name: agentgate deps (hallucinated-dependency gate)
        run: >
          node packages/cli/dist/index.js deps .
          --ignore 'packages/*/test/**' 'website/**'
          --fail-on critical
      - name: agentgate lock + ci gate (live fixture server)
        run: |
          node packages/cli/dist/index.js lock --config .github/dogfood/mcp.json
          node packages/cli/dist/index.js ci --config .github/dogfood/mcp.json --fail-on high
