name: stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "bug,security,roadmap,pinned,advisory"
          exempt-pr-labels: "security,pinned"
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. Comment or add the `pinned` label to keep
            it open.
          stale-pr-message: >
            This PR has been inactive for 30 days. It will be closed in 14 days
            unless there is new activity. Rebase or comment to keep it open.
          operations-per-run: 100
