name: route-c

on:
  push:
    branches: [main]
    paths: ["packages/config-convert/**", "packages/action/**", ".github/workflows/route-c.yml"]
  pull_request:
    paths: ["packages/config-convert/**", "packages/action/**", ".github/workflows/route-c.yml"]

jobs:
  # config-convert build/lint/test is covered by the workspace-wide ci.yml (pnpm).
  action-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate action.yml
        run: |
          python3 - <<'EOF'
          import os, yaml
          if not os.path.exists("packages/action/action.yml"):
              print("action.yml not present yet; skipping")
              raise SystemExit(0)
          with open("packages/action/action.yml") as f:
              a = yaml.safe_load(f)
          assert a["runs"]["using"] == "composite"
          for key in ("name", "description", "branding", "inputs", "outputs"):
              assert key in a, f"missing {key}"
          print("action.yml OK")
          EOF
      - name: Validate .pre-commit-hooks.yaml
        run: |
          python3 - <<'EOF'
          import os, yaml, re
          if not os.path.exists(".pre-commit-hooks.yaml"):
              print(".pre-commit-hooks.yaml not present yet; skipping")
              raise SystemExit(0)
          with open(".pre-commit-hooks.yaml") as f:
              hooks = yaml.safe_load(f)
          assert isinstance(hooks, list) and hooks
          for h in hooks:
              for key in ("id", "name", "entry", "language"):
                  assert key in h, f"missing {key} in {h}"
              if "files" in h:
                  re.compile(h["files"])
          print(".pre-commit-hooks.yaml OK")
          EOF

  # Run the composite action end-to-end against the published CLI:
  # lock (--out) → ci (--lockfile) → scan with SARIF output.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create MCP config fixture
        run: |
          mkdir -p /tmp/smoke
          cat > /tmp/smoke/.mcp.json <<'EOF'
          {
            "mcpServers": {
              "everything": { "command": "npx", "args": ["-y", "@modelcontextprotocol/server-everything@2026.7.4"] }
            }
          }
          EOF
      - name: agentgate lock via action
        uses: ./packages/action
        with:
          command: lock
          working-directory: /tmp/smoke
          args: --config .mcp.json --timeout 120000
      - name: agentgate ci via action
        uses: ./packages/action
        with:
          command: ci
          working-directory: /tmp/smoke
          args: --config .mcp.json --timeout 120000
      - name: agentgate scan with SARIF via action
        uses: ./packages/action
        with:
          command: scan
          working-directory: /tmp/smoke
          sarif-file: agentgate.sarif
          args: --config .mcp.json --fail-on critical
      - name: Assert artifacts
        run: |
          test -s /tmp/smoke/agentgate.lock
          test -s /tmp/smoke/agentgate.sarif
          python3 -c "import json; json.load(open('/tmp/smoke/agentgate.sarif'))"
          echo "action smoke OK"
