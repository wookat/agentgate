version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # supply-chain caution: let new releases bake before adopting
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript-eslint does not support TS 7.x yet
      # (https://github.com/typescript-eslint/typescript-eslint/issues/10940);
      # unignore once support lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
