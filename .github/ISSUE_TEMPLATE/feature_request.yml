name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AgentGate can't do (well) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. CLI sketch / example output welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other tools that partially cover this.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not runtime proxy/gateway functionality (out of scope — see ROADMAP.md non-goals)
